<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>API Playground</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: #fff;
        font-family: system-ui, -apple-system, sans-serif;
      }
      #app {
        min-height: 100vh;
      }
      #error {
        display: none;
        padding: 2rem;
        max-width: 42rem;
        margin: 0 auto;
        color: #b42318;
      }
      #error h1 {
        font-size: 1.25rem;
        margin: 0 0 0.5rem;
      }
      #error p {
        margin: 0.5rem 0;
        color: #344054;
        line-height: 1.5;
      }
      #error code {
        background: #f2f4f7;
        padding: 0.1rem 0.35rem;
        border-radius: 4px;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="error" role="alert">
      <h1>API Playground failed to load</h1>
      <p id="error-detail"></p>
      <p>Check your network connection and reload the page.</p>
    </div>
    <!-- Mock helper inlined so index.html + helper cannot get out of sync on deploy -->
    <script>
      (function (global) {
        function pathToRegex(openApiPath) {
          var pattern = openApiPath.replace(/\{[^}]+\}/g, '[^/]+').replace(/\//g, '\\/');
          return new RegExp('^' + pattern + '$');
        }
        function normalizePath(pathname) {
          var path = pathname || '/';
          if (path.length > 1 && path.endsWith('/')) path = path.slice(0, -1);
          return path;
        }
        function requestUrl(input) {
          if (typeof input === 'string') return input;
          if (input && typeof input.url === 'string') return input.url;
          return String(input);
        }
        function requestMethod(input, init) {
          if (init && init.method) return init.method;
          if (input && typeof input.method === 'string') return input.method;
          return 'GET';
        }
        function findRoute(fixtures, method, pathname) {
          var path = normalizePath(pathname);
          var m = (method || 'get').toLowerCase();
          for (var i = 0; i < fixtures.routes.length; i++) {
            var route = fixtures.routes[i];
            if (route.method !== m) continue;
            if (route.path === path) return route;
            if (pathToRegex(route.path).test(path)) return route;
          }
          return null;
        }
        function jsonResponse(status, body) {
          if (status === 204) {
            return new Response(null, {status: 204, statusText: 'No Content'});
          }
          return new Response(JSON.stringify(body), {
            status: status,
            statusText: 'OK',
            headers: {'Content-Type': 'application/json', 'X-Mock-Source': 'openapi-examples'},
          });
        }
        function isSpecRequest(url, specUrl) {
          if (!specUrl) return false;
          try {
            var target = new URL(url, global.location.href);
            var spec = new URL(specUrl, global.location.href);
            return target.pathname === spec.pathname;
          } catch (e) {
            return String(url).indexOf('openapi.yaml') !== -1 || String(url).indexOf('openapi.json') !== -1;
          }
        }
        function isMockApiRequest(url, mockServerUrl) {
          try {
            var u = new URL(url, global.location.href);
            var mock = new URL(mockServerUrl, global.location.href);
            if (u.origin === mock.origin && u.pathname.indexOf(mock.pathname) === 0) return true;
            if (u.hostname === 'playground.mock') return true;
            if (u.hostname === 'localhost' && u.port === '4010') return true;
            if (u.hostname === '127.0.0.1' && u.port === '4010') return true;
          } catch (e) {
            /* ignore */
          }
          return false;
        }
        function apiPathFromMockUrl(requestUrlStr, mockServerUrl) {
          var u = new URL(requestUrlStr, global.location.href);
          var mock = new URL(mockServerUrl, global.location.href);
          var prefix = mock.pathname.replace(/\/$/, '');
          var path = u.pathname;
          if (path.indexOf(prefix) === 0) path = path.slice(prefix.length) || '/';
          return normalizePath(path);
        }
        function getMockServerUrl() {
          return new URL('mock-api', global.location.href).href.replace(/\/$/, '');
        }
        function createOpenApiMockFetch(fixtures, specUrl, mockServerUrl) {
          var nativeFetch = global.__alonixNativeFetch || global.fetch.bind(global);
          var mockBase = mockServerUrl || getMockServerUrl();
          return function customFetch(input, init) {
            var url = requestUrl(input);
            if (isSpecRequest(url, specUrl)) return nativeFetch(input, init);
            if (!isMockApiRequest(url, mockBase)) return nativeFetch(input, init);
            var method = requestMethod(input, init);
            var apiPath = apiPathFromMockUrl(url, mockBase);
            var route = findRoute(fixtures, method, apiPath);
            if (!route) {
              return Promise.resolve(
                jsonResponse(404, {
                  message: 'No mock example for ' + method.toUpperCase() + ' ' + apiPath,
                })
              );
            }
            return Promise.resolve(jsonResponse(route.status, route.body));
          };
        }
        function installMockFetch(fixtures, specUrl, mockServerUrl) {
          var mockFetch = createOpenApiMockFetch(fixtures, specUrl, mockServerUrl);
          if (!global.__alonixNativeFetch) {
            global.__alonixNativeFetch = global.fetch.bind(global);
          }
          global.fetch = function (input, init) {
            return mockFetch(input, init);
          };
          return mockFetch;
        }
        global.OpenApiMockFetch = {
          getMockServerUrl: getMockServerUrl,
          createOpenApiMockFetch: createOpenApiMockFetch,
          installMockFetch: installMockFetch,
          loadFixtures: function (fixturesUrl) {
            var nativeFetch = global.__alonixNativeFetch || global.fetch.bind(global);
            return nativeFetch(fixturesUrl).then(function (res) {
              if (!res.ok) throw new Error('Failed to load mock fixtures (' + res.status + ')');
              return res.json();
            });
          },
        };
      })(window);
    </script>
    <script src="https://cdn.jsdelivr.net/npm/@scalar/api-reference@1.28.25"></script>
    <script>
      (function () {
        var TOKEN_KEY = 'alonix_playground_bearer_token';

        function showError(message) {
          document.getElementById('app').style.display = 'none';
          var el = document.getElementById('error');
          document.getElementById('error-detail').textContent = message;
          el.style.display = 'block';
        }

        function readStoredToken() {
          try {
            return localStorage.getItem(TOKEN_KEY) || '';
          } catch (e) {
            return '';
          }
        }

        function storeToken(token) {
          try {
            if (token) localStorage.setItem(TOKEN_KEY, token);
            else localStorage.removeItem(TOKEN_KEY);
          } catch (e) {
            /* ignore */
          }
        }

        if (typeof Scalar === 'undefined' || typeof Scalar.createApiReference !== 'function') {
          showError('Scalar API Reference script did not load. Check your network connection.');
          return;
        }

        if (!window.OpenApiMockFetch || typeof window.OpenApiMockFetch.getMockServerUrl !== 'function') {
          showError('Mock helper failed to initialize.');
          return;
        }

        var params = new URLSearchParams(window.location.search);
        var specUrl = params.get('spec') || '/openapi.yaml';
        var mode = params.get('mode') || 'mock';
        var isMock = mode !== 'sandbox';
        var mockUrl = window.OpenApiMockFetch.getMockServerUrl();
        var sandboxUrl = params.get('sandboxUrl') || 'http://localhost:5005/api';
        var defaultServer = isMock ? mockUrl : params.get('server') || sandboxUrl;
        var opPath = params.get('path');
        var opMethod = params.get('method');
        var storedToken = readStoredToken();
        var fixturesUrl = new URL('./mock-fixtures.json', window.location.href).href;

        function mountScalar(customFetch) {
          var servers = isMock
            ? [{url: mockUrl, description: 'Mock (OpenAPI examples — browser)'}]
            : [
                {url: defaultServer, description: 'Active target'},
                {url: mockUrl, description: 'Mock (OpenAPI examples)'},
                {url: sandboxUrl, description: 'Sandbox backend'},
              ];

          var config = {
            url: specUrl,
            servers: servers,
            customFetch: customFetch,
            fetch: customFetch,
            authentication: {
              preferredSecurityScheme: 'bearerAuth',
              securitySchemes: {
                bearerAuth: {token: storedToken},
              },
            },
            layout: 'modern',
            deepLinking: true,
            showSidebar: true,
            hideModels: false,
            defaultOpenAllTags: false,
            onBeforeRequest: function (ctx) {
              var requestBuilder = ctx.requestBuilder;
              if (!requestBuilder) return;
              var securities = requestBuilder.security || [];
              for (var i = 0; i < securities.length; i++) {
                var sec = securities[i];
                if (sec && sec.format === 'bearer' && sec.value) {
                  storeToken(sec.value);
                  break;
                }
              }
            },
          };

          if (opPath && opMethod) {
            config.initialOperation = {
              path: opPath.startsWith('/') ? opPath : '/' + opPath,
              method: opMethod.toLowerCase(),
            };
          }

          try {
            Scalar.createApiReference('#app', config);
          } catch (err) {
            showError(err && err.message ? err.message : String(err));
          }
        }

        if (isMock) {
          window.OpenApiMockFetch.loadFixtures(fixturesUrl)
            .then(function (fixtures) {
              var customFetch = window.OpenApiMockFetch.installMockFetch(fixtures, specUrl, mockUrl);
              mountScalar(customFetch);
            })
            .catch(function (err) {
              showError(err && err.message ? err.message : String(err));
            });
          return;
        }

        mountScalar(window.fetch.bind(window));
      })();
    </script>
  </body>
</html>
