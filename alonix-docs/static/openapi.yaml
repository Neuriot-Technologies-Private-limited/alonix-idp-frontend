openapi: 3.0.3
info:
  title: Alonix IDP Backend API
  version: 1.0.0
  description: |-
    Production API for Alonix IDP — identity, RBAC, documents, chat, billing, and connectors.

    **Deployment profile:** `saas`

    **Base URL:** All paths below are relative to `/api` (server URL already includes `/api`).

    **Auth:** Call `POST /users/login`, copy `token`, then Authorize with `Bearer <token>`.
    For workspace-scoped routes, set header `X-Group-Id` to the active group ObjectId.

    **Postman:** Import OpenAPI from `GET /api/docs/openapi.json` (File → Import).

    **Rate limit:** 100 requests / 15 min per IP on `/api/*`.

    **Playground:** Use mock mode (default) or sandbox via `DOCUSAURUS_API_MODE`.
    **Docs-only paths:** `/auth/login` (alias), `/users/me` (composite profile).
  contact:
    name: Alonix API Support
servers:
  - url: http://localhost:4010
    description: Mock server (Prism)
  - url: http://localhost:5005/api
    description: Sandbox backend (local dev)
  - url: http://localhost:5005/api
    description: API (local or BACKEND_URL)
security:
  - bearerAuth: []
tags:
  - name: Health
    description: API root / welcome
  - name: Auth
    description: Login, logout, and session tokens
  - name: Groups
    description: Workspaces — create, list, read, and delete
  - name: Users
    description: Onboarding, profile, invites, and account
  - name: Documents
    description: Upload, ingest, extract, classify, jobs
  - name: Chats
    description: RAG Q&A and session history
  - name: Admin
    description: Org RBAC, metrics, audit, workspace members
  - name: Billing
    description: Plans, Stripe checkout, subscription
  - name: Connectors
    description: Email, SFTP, SharePoint integrations
  - name: Webhooks
    description: Internal pipeline callbacks
  - name: Internal
    description: Service-to-service audit ingestion
  - name: Setup
    description: Enterprise one-time bootstrap
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: "JWT from POST /users/login. Enter: Bearer <token>"
    internalWebhook:
      type: apiKey
      in: header
      name: X-Internal-Token
      description: Matches INTERNAL_WEBHOOK_SECRET (Python pipeline callbacks).
    stripeWebhook:
      type: apiKey
      in: header
      name: Stripe-Signature
      description: Stripe webhook signature (request body must be raw bytes).
  parameters:
    OrgIdPath:
      name: orgId
      in: path
      required: true
      schema:
        type: string
        example: 507f1f77bcf86cd799439011
    GroupIdPath:
      name: groupId
      in: path
      required: true
      schema:
        type: string
        example: 507f1f77bcf86cd799439012
    UserIdPath:
      name: userId
      in: path
      required: true
      schema:
        type: string
    DocumentIdPath:
      name: id
      in: path
      required: true
      schema:
        type: string
    ConnectorIdPath:
      name: id
      in: path
      required: true
      schema:
        type: string
    JobIdPath:
      name: jobId
      in: path
      required: true
      schema:
        type: string
    SessionIdPath:
      name: sessionId
      in: path
      required: true
      schema:
        type: string
    InviteIdPath:
      name: inviteId
      in: path
      required: true
      schema:
        type: string
    MailboxIdPath:
      name: mailboxId
      in: path
      required: true
      schema:
        type: string
    EmailUidPath:
      name: uid
      in: path
      required: true
      schema:
        type: string
    OAuthSessionIdPath:
      name: sessionId
      in: path
      required: true
      schema:
        type: string
    SiteIdPath:
      name: siteId
      in: path
      required: true
      schema:
        type: string
    UserEmailPath:
      name: userEmail
      in: path
      required: true
      schema:
        type: string
    XGroupId:
      name: X-Group-Id
      in: header
      required: false
      schema:
        type: string
        example: 507f1f77bcf86cd799439012
      description: Active workspace group ObjectId
    XRequestId:
      name: X-Request-Id
      in: header
      schema:
        type: string
    InviteTokenQuery:
      name: inviteToken
      in: query
      required: true
      schema:
        type: string
    BrowsePathQuery:
      name: path
      in: query
      schema:
        type: string
    DateFromQuery:
      name: from
      in: query
      schema:
        type: string
        format: date-time
    DateToQuery:
      name: to
      in: query
      schema:
        type: string
        format: date-time
    AuditLimitQuery:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 500
        default: 50
    AuditSkipQuery:
      name: skip
      in: query
      schema:
        type: integer
        minimum: 0
        default: 0
    ActorEmailQuery:
      name: actorEmail
      in: query
      schema:
        type: string
        format: email
    AuditActionQuery:
      name: action
      in: query
      schema:
        type: string
  responses:
    Unauthorized:
      description: Missing or invalid credentials / token
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorMessage"
          examples:
            invalidCredentials:
              value:
                message: Invalid email or password
            missingToken:
              value:
                message: Authentication required
            expiredToken:
              value:
                message: Token expired
                code: TOKEN_EXPIRED
    Forbidden:
      description: Insufficient role or scope
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorMessage"
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorMessage"
          examples:
            userNotFound:
              value:
                message: User not found
    BadRequest:
      description: Validation error — missing or invalid fields
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorMessage"
          examples:
            missingFields:
              value:
                message: email and password are required
            invalidEmail:
              value:
                message: Validation failed
                details: email must be a valid email address
    ServerError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorMessage"
          examples:
            serverError:
              value:
                message: Internal server error
                requestId: req_01HYZABCDEF123456
    LoginSuccess:
      description: Login successful
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/LoginResponse"
          examples:
            success:
              $ref: "#/components/examples/LoginSuccessBody"
  schemas:
    ErrorMessage:
      type: object
      properties:
        message:
          type: string
        error:
          type: string
        code:
          type: string
        details:
          type: string
        requestId:
          type: string
    ObjectId:
      type: string
      pattern: ^[a-fA-F0-9]{24}$
      example: 507f1f77bcf86cd799439011
    DocumentSensitivity:
      type: string
      enum:
        - PUBLIC
        - INTERNAL_USE
        - CONFIDENTIAL
        - HIGHLY_CONFIDENTIAL
        - RESTRICTED
    OrgRole:
      type: string
      enum:
        - COMPANY_ADMIN
        - MEMBER
    GroupRole:
      type: string
      enum:
        - GROUP_ADMIN
        - SEARCH_USER
    UserStatus:
      type: string
      enum:
        - ACTIVE
        - INACTIVE
    ConnectorType:
      type: string
      enum:
        - EMAIL
        - SFTP
        - SHAREPOINT
    PlanName:
      type: string
      enum:
        - FREE
        - STARTER
        - PRO
        - ENTERPRISE
    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          example: demo.admin@alonix.example
        password:
          type: string
          format: password
          example: DemoPass123!
        orgId:
          type: string
          description: Optional org scope for multi-tenant login
    LoginResponse:
      type: object
      properties:
        message:
          type: string
          example: Login successful
        token:
          type: string
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.mock.token
        user:
          $ref: "#/components/schemas/UserProfile"
        context:
          $ref: "#/components/schemas/AuthContext"
        csrfToken:
          type: string
          example: csrf_mock_token_abc123
    OnboardRequest:
      type: object
      required:
        - companyName
        - email
        - password
      properties:
        companyName:
          type: string
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
        name:
          type: string
    OnboardInviteRequest:
      type: object
      required:
        - inviteToken
        - email
        - password
      properties:
        inviteToken:
          type: string
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
        name:
          type: string
    InviteToGroupRequest:
      type: object
      required:
        - groupId
        - email
      properties:
        groupId:
          type: string
        email:
          type: string
          format: email
        name:
          type: string
        role:
          $ref: "#/components/schemas/GroupRole"
        maxDocumentSensitivity:
          $ref: "#/components/schemas/DocumentSensitivity"
    VerifyEmailRequest:
      type: object
      required:
        - email
        - otp
      properties:
        email:
          type: string
          format: email
        otp:
          type: string
    ForgotPasswordRequest:
      type: object
      required:
        - email
      properties:
        email:
          type: string
          format: email
        orgId:
          type: string
    ResetPasswordRequest:
      type: object
      required:
        - email
        - token
        - newPassword
      properties:
        email:
          type: string
          format: email
        token:
          type: string
        newPassword:
          type: string
          minLength: 8
        orgId:
          type: string
    ChangePasswordRequest:
      type: object
      required:
        - currentPassword
        - newPassword
      properties:
        currentPassword:
          type: string
        newPassword:
          type: string
          minLength: 8
        orgId:
          type: string
    UpdateUserProfileRequest:
      type: object
      required:
        - orgId
      properties:
        orgId:
          type: string
        groupId:
          type: string
        name:
          type: string
        status:
          $ref: "#/components/schemas/UserStatus"
    UpdateOrgUserRequest:
      type: object
      properties:
        name:
          type: string
        status:
          $ref: "#/components/schemas/UserStatus"
    AdminGroupCreateRequest:
      type: object
      required:
        - groupName
      properties:
        groupName:
          type: string
        description:
          type: string
    GroupMemberUpsertRequest:
      type: object
      required:
        - userEmail
      properties:
        userEmail:
          type: string
          format: email
        role:
          $ref: "#/components/schemas/GroupRole"
        maxDocumentSensitivity:
          $ref: "#/components/schemas/DocumentSensitivity"
    GroupMemberRoleUpdateRequest:
      type: object
      required:
        - role
      properties:
        role:
          $ref: "#/components/schemas/GroupRole"
        maxDocumentSensitivity:
          $ref: "#/components/schemas/DocumentSensitivity"
    DocumentSensitivityPolicyRequest:
      type: object
      required:
        - enabledDocumentSensitivityLevels
      properties:
        enabledDocumentSensitivityLevels:
          type: array
          items:
            $ref: "#/components/schemas/DocumentSensitivity"
    ChatAskRequest:
      type: object
      required:
        - query
      properties:
        groupId:
          type: string
        collectionName:
          type: string
        sessionId:
          type: string
        query:
          type: string
        fileKey:
          type: string
    ChatDeleteRequest:
      type: object
      required:
        - sessionId
      properties:
        sessionId:
          type: string
        groupId:
          type: string
    SourceUrlRequest:
      type: object
      properties:
        fileKey:
          type: string
        documentId:
          type: string
    BatchIngestRequest:
      type: object
      required:
        - documentIds
      properties:
        documentIds:
          type: array
          items:
            type: string
    ExtractRequest:
      type: object
      properties:
        format:
          type: string
          default: json
    CheckoutSessionRequest:
      type: object
      required:
        - planName
      properties:
        planName:
          $ref: "#/components/schemas/PlanName"
        billingCycle:
          type: string
          enum:
            - monthly
            - annually
    ConnectorCreateRequest:
      type: object
      required:
        - name
        - type
        - config
      properties:
        name:
          type: string
        type:
          $ref: "#/components/schemas/ConnectorType"
        ingestHistoric:
          type: boolean
        config:
          type: object
          additionalProperties: true
    ConnectorPatchRequest:
      type: object
      properties:
        name:
          type: string
        autoIngest:
          type: boolean
        pollIntervalMs:
          type: integer
        remotePath:
          type: string
    ConnectorIngestRequest:
      type: object
      properties:
        paths:
          type: array
          items:
            type: string
        groupId:
          type: string
    JobCallbackRequest:
      type: object
      properties:
        status:
          type: string
        extractedData:
          type: object
          additionalProperties: true
        classifiedData:
          type: object
          additionalProperties: true
        resultData:
          type: object
          additionalProperties: true
        error:
          type: string
    AiSettingsUpdate:
      type: object
      additionalProperties: true
    SharePointSettingsUpdate:
      type: object
      properties:
        clientId:
          type: string
        clientSecret:
          type: string
          description: Plain secret — encrypted at rest
        tenantId:
          type: string
    DocumentExtractionReviewRequest:
      type: object
      description: Human-reviewed extraction fields (pages array)
      additionalProperties: true
    DocumentClassificationReviewRequest:
      type: object
      description: Human-reviewed classification labels
      additionalProperties: true
    MailboxCreateRequest:
      type: object
      required:
        - emailAddress
      properties:
        emailAddress:
          type: string
          format: email
        displayName:
          type: string
        groupId:
          type: string
        encryptedPassword:
          type: string
        wrapKeyId:
          type: string
    MailboxPatchRequest:
      type: object
      properties:
        displayName:
          type: string
        status:
          type: string
          enum:
            - ACTIVE
            - INACTIVE
        encryptedPassword:
          type: string
        wrapKeyId:
          type: string
    EmailIngestRequest:
      type: object
      properties:
        attachmentIds:
          type: array
          items:
            type: string
        archivePaths:
          type: array
          items:
            type: string
        ingestAllIngestable:
          type: boolean
        async:
          type: boolean
          description: Queue via BullMQ when true
    SharePointOAuthCompleteRequest:
      type: object
      required:
        - name
        - siteUrl
      properties:
        name:
          type: string
        siteUrl:
          type: string
        siteId:
          type: string
        libraryName:
          type: string
        driveName:
          type: string
        ingestHistoric:
          type: boolean
    UserProfile:
      type: object
      properties:
        _id:
          type: string
          example: 66f1abcd1234567890ef1234
        id:
          type: string
          example: 66f1abcd1234567890ef1234
        email:
          type: string
          format: email
          example: demo.admin@alonix.example
        name:
          type: string
          example: Demo Admin
        username:
          type: string
          example: demo.admin@alonix.example
        avatarUrl:
          type: string
          nullable: true
          example: null
        orgId:
          type: string
          example: 507f1f77bcf86cd799439011
        groupId:
          type: string
          example: 507f1f77bcf86cd799439012
    AuthContext:
      type: object
      additionalProperties: true
      properties:
        orgId:
          type: string
        orgRole:
          type: string
          enum:
            - COMPANY_ADMIN
            - MEMBER
        activeGroupId:
          type: string
        groups:
          type: array
          items:
            type: object
            properties:
              groupId:
                type: string
              groupName:
                type: string
              role:
                type: string
    CurrentUserResponse:
      type: object
      properties:
        user:
          $ref: "#/components/schemas/UserProfile"
        context:
          $ref: "#/components/schemas/AuthContext"
        csrfToken:
          type: string
    UserContextResponse:
      type: object
      properties:
        context:
          $ref: "#/components/schemas/AuthContext"
        csrfToken:
          type: string
  examples:
    LoginSuccessBody:
      value:
        message: Login successful
        token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.mock.token
        user:
          _id: 66f1abcd1234567890ef1234
          id: 66f1abcd1234567890ef1234
          email: demo.admin@alonix.example
          name: Demo Admin
          username: demo.admin@alonix.example
          avatarUrl: null
          orgId: 507f1f77bcf86cd799439011
          groupId: 507f1f77bcf86cd799439012
        context:
          orgId: 507f1f77bcf86cd799439011
          orgRole: COMPANY_ADMIN
          activeGroupId: 507f1f77bcf86cd799439012
          groups:
            - groupId: 507f1f77bcf86cd799439012
              groupName: Default Workspace
              role: GROUP_ADMIN
        csrfToken: csrf_mock_token_abc123
    CurrentUserSuccess:
      value:
        user:
          _id: 66f1abcd1234567890ef1234
          email: demo.admin@alonix.example
          name: Demo Admin
          orgId: 507f1f77bcf86cd799439011
        context:
          orgId: 507f1f77bcf86cd799439011
          orgRole: COMPANY_ADMIN
          activeGroupId: 507f1f77bcf86cd799439012
        csrfToken: csrf_mock_token_abc123
paths:
  /admin/orgs/{orgId}/users/{userId}:
    patch:
      tags:
        - Admin
      summary: Update org user (admin)
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/OrgIdPath"
        - $ref: "#/components/parameters/UserIdPath"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateOrgUserRequest"
      responses:
        "200":
          description: User updated
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags:
        - Admin
      summary: Update org user (PUT alias)
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/OrgIdPath"
        - $ref: "#/components/parameters/UserIdPath"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateOrgUserRequest"
      responses:
        "200":
          description: User updated
    post:
      tags:
        - Admin
      summary: Update org user (POST alias)
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/OrgIdPath"
        - $ref: "#/components/parameters/UserIdPath"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateOrgUserRequest"
      responses:
        "200":
          description: User updated
    delete:
      tags:
        - Admin
      summary: Remove user from organization
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/OrgIdPath"
        - $ref: "#/components/parameters/UserIdPath"
      responses:
        "200":
          description: User removed
        "400":
          description: Cannot remove self
  /admin/orgs/{orgId}/groups:
    get:
      tags:
        - Admin
      summary: List workspaces for org
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/OrgIdPath"
      responses:
        "200":
          description: Groups with membershipRole
    post:
      tags:
        - Admin
      summary: Create workspace
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/OrgIdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminGroupCreateRequest"
      responses:
        "201":
          description: Group created
  /admin/orgs/{orgId}/users:
    get:
      tags:
        - Admin
      summary: List org users with workspaces
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/OrgIdPath"
      responses:
        "200":
          description: Users array with orgRole and workspaces
  /admin/orgs/{orgId}/dashboard-state:
    get:
      tags:
        - Admin
      summary: Aggregated dashboard payload
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/OrgIdPath"
      responses:
        "200":
          description: Stats, groups, pipeline preview, optional audit
  /admin/orgs/{orgId}/stats:
    get:
      tags:
        - Admin
      summary: Dashboard stat cards
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/OrgIdPath"
      responses:
        "200":
          description: totals and tendencies
  /admin/orgs/{orgId}/metrics/summary:
    get:
      tags:
        - Admin
      summary: Metrics summary
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/OrgIdPath"
      responses:
        "200":
          description: Full metrics summary
  /admin/orgs/{orgId}/metrics/activity-series:
    get:
      tags:
        - Admin
      summary: Activity time series
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/OrgIdPath"
        - $ref: "#/components/parameters/DateFromQuery"
        - $ref: "#/components/parameters/DateToQuery"
      responses:
        "200":
          description: Series data
  /admin/orgs/{orgId}/metrics/by-user:
    get:
      tags:
        - Admin
      summary: Per-user activity metrics
      description: Company admin only.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/OrgIdPath"
        - $ref: "#/components/parameters/DateFromQuery"
        - $ref: "#/components/parameters/DateToQuery"
      responses:
        "200":
          description: Per-user rows
  /admin/orgs/{orgId}/metrics/pipeline:
    get:
      tags:
        - Admin
      summary: Document pipeline metrics
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/OrgIdPath"
      responses:
        "200":
          description: Pipeline counts
  /admin/orgs/{orgId}/audit-logs:
    get:
      tags:
        - Admin
      summary: Org audit logs
      description: Company admin only.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/OrgIdPath"
        - $ref: "#/components/parameters/DateFromQuery"
        - $ref: "#/components/parameters/DateToQuery"
        - $ref: "#/components/parameters/AuditLimitQuery"
        - $ref: "#/components/parameters/AuditSkipQuery"
        - $ref: "#/components/parameters/ActorEmailQuery"
        - $ref: "#/components/parameters/AuditActionQuery"
        - name: groupId
          in: query
          schema:
            type: string
      responses:
        "200":
          description: logs, total, skip, limit
  /admin/groups/{groupId}/audit-logs:
    get:
      tags:
        - Admin
      summary: Workspace audit logs
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/GroupIdPath"
        - $ref: "#/components/parameters/DateFromQuery"
        - $ref: "#/components/parameters/DateToQuery"
        - $ref: "#/components/parameters/AuditLimitQuery"
        - $ref: "#/components/parameters/AuditSkipQuery"
        - $ref: "#/components/parameters/ActorEmailQuery"
        - $ref: "#/components/parameters/AuditActionQuery"
      responses:
        "200":
          description: Scoped audit logs
  /admin/orgs/{orgId}/reports/activity:
    get:
      tags:
        - Admin
      summary: Export activity CSV
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/OrgIdPath"
        - $ref: "#/components/parameters/DateFromQuery"
        - $ref: "#/components/parameters/DateToQuery"
      responses:
        "200":
