  /internal/audit-events:
    post:
      tags:
        - Internal
      summary: Ingest audit event from internal Python ML services
      description: |
        Receives audit events from internal pipeline services (Python ML, connectors).
        Uses token + HMAC signature auth (production requires signature).
        Supports idempotency via optional eventId field.
      security:
        - internalWebhook: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - orgId
                - action
                - targetType
                - targetId
              properties:
                orgId:
                  type: string
                  description: Organization ID (tenant scope)
                  example: org_abc123
                action:
                  type: string
                  description: Audit action (must exist in AUDIT_ACTIONS)
                  example: DOCUMENT_EXTRACT_STARTED
                targetType:
                  type: string
                  description: Target entity type
                  example: DOCUMENT
                targetId:
                  type: string
                  description: Target entity identifier
                  example: doc_xyz789
                groupId:
                  type: string
                  nullable: true
                  description: Optional group scope
                actorEmail:
                  type: string
                  default: system@pipeline
                  description: Actor email (defaults to system@pipeline)
                metadata:
                  type: object
                  description: Arbitrary metadata (secrets will be redacted)
                requestId:
                  type: string
                  nullable: true
                  description: Correlation request ID
                eventId:
                  type: string
                  nullable: true
                  description: Idempotency key — duplicate events with same orgId+eventId are skipped
      responses:
        "200":
          description: Duplicate event (idempotent — already exists)
          content:
            application/json:
              schema:
                type: object
                properties:
                  accepted:
                    type: boolean
                    example: true
                  duplicate:
                    type: boolean
                    example: true
                  id:
                    type: string
                    example: 665f1a2b3c4d5e6f7a8b9c0d
        "201":
          description: Audit event created
          content:
            application/json:
              schema:
                type: object
                properties:
                  accepted:
                    type: boolean
                    example: true
                  id:
                    type: string
                    example: 665f1a2b3c4d5e6f7a8b9c0d
        "400":
          description: Missing required fields
        "401":
          description: Invalid or missing internal auth token/signature
        "500":
          description: Internal server error
