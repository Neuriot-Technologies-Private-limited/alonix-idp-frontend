                  description: JPEG, PNG, WebP, or GIF (max 1.4MB)
      responses:
        "200":
          description: Avatar uploaded
        "400":
          $ref: "#/components/responses/BadRequest"
        "413":
          description: File too large
    delete:
      tags:
        - Users
      summary: Remove profile avatar
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Avatar removed
  /users/update/{userId}:
    put:
      tags:
        - Users
      summary: Update user profile or status (scoped)
      security:
        - bearerAuth: []
      parameters:
