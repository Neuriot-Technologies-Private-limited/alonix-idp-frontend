# Docs ship inside the frontend dist/ on AWS (nginx /docs/).
# Production deploy: alonix-idp-frontend/.github/workflows/deploy-aws.yml
#
# This workflow only runs a standalone docs build (e.g. path-filter checks).

name: Build 1-Glance Docs (standalone)

on:
  push:
    branches: [ alonix-1-glance]
    paths:
      - '**'
  workflow_dispatch:

defaults:
  run:
    working-directory: .

jobs:
  build:
    if: hashFiles('package.json') != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Sync OpenAPI from backend
        run: npm run sync:openapi
        continue-on-error: true

      - name: Build docs (local paths)
        run: npm run build

      - name: Build docs (/docs subpath — production parity)
        env:
          DOCUSAURUS_BASE_URL: /docs/
          DOCUSAURUS_SITE_URL: https://example.com
          DOCUSAURUS_API_MODE: mock
        run: npm run build
