name: Deploy alonix-1-glance frontend dist to AWS
# Push to alonix-1-glance → GitHub Environment "staging".
# Manual run can choose staging or production.

on:
  push:
    branches:
      - alonix-1-glance
  workflow_dispatch:
    inputs:
      target:
        description: GitHub Environment to deploy
        type: choice
        options:
          - staging
          - production
        default: staging

concurrency:
  group: deploy-aws-${{ github.event.inputs.target || 'staging' }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install Gitleaks
        env:
          GITLEAKS_VERSION: 8.24.2
        run: |
          set -euo pipefail
          GITLEAKS_DIR="${RUNNER_TEMP}/gitleaks"
          mkdir -p "$GITLEAKS_DIR"
          curl -sSfL \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C "$GITLEAKS_DIR" gitleaks
          chmod +x "${GITLEAKS_DIR}/gitleaks"
          echo "${GITLEAKS_DIR}" >> "$GITHUB_PATH"

      - name: Scan for secrets (Gitleaks)
        run: |
          gitleaks version
          gitleaks detect --source . --config .gitleaks.toml --verbose

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: ESLint (src)
        run: npm run lint
      - run: npm run test:run
      - name: npm audit (fail on high+)
        run: npm audit --omit=dev --audit-level=high

  build:
    name: Build dist
    needs: security
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.target || 'staging' }}
    steps:
      - uses: actions/checkout@v6

      - name: Verify alonix-docs is present
        run: |
          test -f alonix-docs/package.json || {
            echo "alonix-docs/ is missing from this commit."
            exit 1
          }

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install app dependencies
        run: npm ci

      - name: Build app + docs into dist/
        env:
          PUBLIC_APP_URL: ${{ vars.PUBLIC_APP_URL }}
          VITE_DEPLOYMENT_PROFILE: ${{ vars.VITE_DEPLOYMENT_PROFILE || 'enterprise' }}
        run: |
          chmod +x scripts/build-dist.sh
          bash scripts/build-dist.sh

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: 1glance-dist
          path: dist
          retention-days: 14

  deploy:
    name: Copy dist to AWS instance
    needs: build
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.target || 'staging' }}
    steps:
      - name: Download dist
        uses: actions/download-artifact@v4
        with:
          name: 1glance-dist
          path: dist

      - name: Copy dist to AWS instance
        env:
          SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          SSH_HOST: ${{ secrets.DEPLOY_HOST }}
          SSH_USER: ${{ secrets.DEPLOY_USER }}
          SSH_PORT: ${{ secrets.DEPLOY_SSH_PORT }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DIST_PATH: ${{ vars.DEPLOY_DIST_PATH }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          touch ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          PORT="${SSH_PORT:-22}"
          if [ -n "${DEPLOY_KNOWN_HOSTS:-}" ]; then
            printf '%s\n' "$DEPLOY_KNOWN_HOSTS" >> ~/.ssh/known_hosts
          else
            ssh-keyscan -T 15 -p "$PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts
          fi
          SSH_OPTS="-i ${HOME}/.ssh/deploy_key -o ConnectTimeout=30 -o StrictHostKeyChecking=yes -o UserKnownHostsFile=${HOME}/.ssh/known_hosts -p ${PORT}"
          DEST="${DIST_PATH:-/var/www/1glance}"
          ssh $SSH_OPTS "${SSH_USER}@${SSH_HOST}" "mkdir -p '${DEST}'"
          rsync -az --delete -e "ssh ${SSH_OPTS}" dist/ "${SSH_USER}@${SSH_HOST}:${DEST}/"
          echo "Published dist/ to ${SSH_USER}@${SSH_HOST}:${DEST}"
          ssh $SSH_OPTS "${SSH_USER}@${SSH_HOST}" \
            "if command -v nginx >/dev/null && nginx -t; then sudo -n nginx -s reload || sudo -n systemctl reload nginx || true; fi"

  notify-slack:
    needs: [security, build, deploy]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: ${{ github.event.inputs.target || 'staging' }}
    env:
      PROJECT_NAME: 1-Glance Frontend (AWS)
      JOB_RESULT: ${{ contains(needs.*.result, 'failure') && 'failure' || contains(needs.*.result, 'cancelled') && 'cancelled' || contains(needs.*.result, 'skipped') && 'skipped' || 'success' }}
    steps:
      - name: Build Slack message
        id: slack
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SECURITY_RESULT: ${{ needs.security.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
        run: |
          set -euo pipefail
          if [ -z "${SLACK_WEBHOOK_URL:-}" ]; then
            echo "send=false" >> "$GITHUB_OUTPUT"
            echo "SLACK_WEBHOOK_URL not set — add it as a staging (or repo) secret."
            exit 0
          fi
          echo "send=true" >> "$GITHUB_OUTPUT"
          SHA_SHORT="${GITHUB_SHA:0:7}"
          case "${JOB_RESULT}" in
            success)   STATUS="✅ SUCCESS" ;;
            cancelled) STATUS="🚫 CANCELLED" ;;
            skipped)   STATUS="⏭️ SKIPPED" ;;
            *)         STATUS="❌ FAILED" ;;
          esac
          if [ -n "${COMMIT_MESSAGE:-}" ]; then
            COMMIT_LINE="$(printf '%s' "$COMMIT_MESSAGE" | head -1 | cut -c1-100)"
          else
            COMMIT_LINE="(manual run — no commit message)"
          fi
          RUN_URL="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          TEXT="$(printf '%s\n*Project:* %s\n*Repo:* `%s`\n*Branch:* `%s`\n*Commit:* `%s` — %s\n*Triggered by:* %s\n*Security:* %s | *Build:* %s | *Deploy:* %s\n<%s|View workflow run>' \
            "$STATUS" "$PROJECT_NAME" "$GITHUB_REPOSITORY" "$GITHUB_REF_NAME" "$SHA_SHORT" "$COMMIT_LINE" "$GITHUB_ACTOR" "$SECURITY_RESULT" "$BUILD_RESULT" "$DEPLOY_RESULT" "$RUN_URL")"
          jq -n --arg text "$TEXT" '{text: $text}' > slack-payload.json

      - name: Notify Slack
        if: steps.slack.outputs.send == 'true'
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          set -euo pipefail
          curl -fsS --max-time 30 --retry 2 --retry-delay 2 \
            -X POST \
            -H 'Content-type: application/json' \
            --data @"slack-payload.json" \
            "$SLACK_WEBHOOK_URL"
          echo "Slack notification sent."
