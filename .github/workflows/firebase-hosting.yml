name: Deploy to Firebase Hosting

on:
  push:
    branches:
      - develop
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  actions: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install Gitleaks
        env:
          GITLEAKS_VERSION: 8.24.2
        run: |
          set -euo pipefail
          GITLEAKS_DIR="${RUNNER_TEMP}/gitleaks"
          mkdir -p "$GITLEAKS_DIR"
          curl -sSfL \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C "$GITLEAKS_DIR" gitleaks
          chmod +x "${GITLEAKS_DIR}/gitleaks"
          echo "${GITLEAKS_DIR}" >> "$GITHUB_PATH"

      - name: Scan for secrets (Gitleaks)
        run: |
          gitleaks version
          gitleaks detect --source . --config .gitleaks.toml --verbose

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: ESLint (src)
        run: npm run lint
      - run: npm run test:run
      # Production deps only — firebase-tools (devDep) pulls transitive tar/uuid advisories
      # that do not ship in the SPA bundle.
      - name: npm audit (fail on high+)
        run: npm audit --omit=dev --audit-level=high

  deploy:
    name: Deploy app + /docs
    needs: security
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout frontend
        uses: actions/checkout@v6

      - name: Verify alonix-docs is present
        run: |
          test -f alonix-docs/package.json || {
            echo "alonix-docs/ is missing from this commit. Add the Help Center folder before deploy."
            exit 1
          }

      - name: Setup Node.js (docs)
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: alonix-docs/package-lock.json

      - name: Resolve docs site URL
        id: docs-site-url
        env:
          PUBLIC_APP_URL: ${{ vars.PUBLIC_APP_URL }}
          FIREBASE_HOSTING_SITE: ${{ secrets.FIREBASE_HOSTING_SITE }}
        run: |
          set -euo pipefail
          # shellcheck source=scripts/resolve-firebase-site-url.sh
          source scripts/resolve-firebase-site-url.sh
          SITE_URL="$(resolve_public_site_url "${PUBLIC_APP_URL:-}" "${FIREBASE_HOSTING_SITE:-}")"
          SITE_ID="$(normalize_firebase_site_id "${FIREBASE_HOSTING_SITE:-}")"
          echo "url=${SITE_URL}" >> "$GITHUB_OUTPUT"
          echo "site_id=${SITE_ID}" >> "$GITHUB_OUTPUT"
          echo "Docs site URL: ${SITE_URL}"
          if [ -n "${SITE_ID}" ]; then
            echo "Firebase hosting site id: ${SITE_ID}"
          fi

      - name: Build docs (Help Center)
        working-directory: alonix-docs
        env:
          DOCUSAURUS_BRAND: findoutai
          DOCUSAURUS_BASE_URL: /docs/
          DOCUSAURUS_SITE_URL: ${{ steps.docs-site-url.outputs.url }}
          DOCUSAURUS_API_MODE: mock
        run: |
          npm ci
          npm run build:ci

      - name: Setup Node.js (app)
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Build app
        env:
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
        run: |
          if [ -z "$VITE_API_BASE_URL" ]; then
            echo "VITE_API_BASE_URL secret is required"
            exit 1
          fi
          printf "VITE_API_BASE_URL=%s\n" "$VITE_API_BASE_URL" > .env.production
          npm ci
          npm run build:findoutai

      - name: Merge docs into dist
        run: |
          chmod +x scripts/merge-docs-into-dist.sh
          ./scripts/merge-docs-into-dist.sh alonix-docs/build dist
          test -f dist/docs/index.html

      - name: Authenticate Firebase service account
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "FIREBASE_SERVICE_ACCOUNT secret is required"
            exit 1
          fi
          SERVICE_ACCOUNT_FILE="$RUNNER_TEMP/firebase-service-account.json"
          printf "%s" "$FIREBASE_SERVICE_ACCOUNT" > "$SERVICE_ACCOUNT_FILE"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$SERVICE_ACCOUNT_FILE" >> "$GITHUB_ENV"

      # F-005: firebase.json's committed connect-src is a baseline allowlist
      # (self, Sentry, Stripe) that deliberately omits the production API/socket
      # host, since that host varies by deploy target. This step appends it
      # just before deploy so it never lives as a hardcoded value in the repo.
      - name: Patch firebase.json CSP connect-src
        env:
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
          VITE_SOCKET_URL: ${{ secrets.VITE_SOCKET_URL }}
          VITE_CSP_CONNECT_EXTRA: ${{ vars.VITE_CSP_CONNECT_EXTRA }}
        run: node scripts/generate-firebase-csp.mjs --patch

      - name: Deploy live hosting (app + /docs)
        env:
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_HOSTING_SITE: ${{ secrets.FIREBASE_HOSTING_SITE }}
        run: |
          if [ -z "$FIREBASE_PROJECT_ID" ]; then
            echo "FIREBASE_PROJECT_ID secret is required"
            exit 1
          fi
          if [ -z "$FIREBASE_HOSTING_SITE" ]; then
            echo "FIREBASE_HOSTING_SITE secret is required"
            exit 1
          fi
          # shellcheck source=scripts/resolve-firebase-site-url.sh
          source scripts/resolve-firebase-site-url.sh
          TARGET_ALIAS="findout-v3"
          TARGET_SITE="$(normalize_firebase_site_id "$FIREBASE_HOSTING_SITE")"
          if [ -z "$TARGET_SITE" ]; then
            echo "FIREBASE_HOSTING_SITE resolved to empty site id (got: ${FIREBASE_HOSTING_SITE})"
            exit 1
          fi
          npx -y firebase-tools target:apply hosting "$TARGET_ALIAS" "$TARGET_SITE" \
            --project "$FIREBASE_PROJECT_ID"
          set +e
          DEPLOY_OUTPUT="$(
            npx -y firebase-tools deploy \
              --only "hosting:${TARGET_ALIAS}" \
              --project "$FIREBASE_PROJECT_ID" \
              --non-interactive 2>&1
          )"
          DEPLOY_EXIT=$?
          set -e
          printf '%s\n' "$DEPLOY_OUTPUT"
          if [ "$DEPLOY_EXIT" -ne 0 ]; then
            if printf '%s' "$DEPLOY_OUTPUT" | grep -qi 'current active version'; then
              echo "Hosting is already serving this build (no-op release). Treating deploy as success."
              DEPLOY_EXIT=0
            else
              exit "$DEPLOY_EXIT"
            fi
          fi
          echo "Live URL: https://${TARGET_SITE}.web.app"
          echo "Docs URL: https://${TARGET_SITE}.web.app/docs/"
          echo "Live URL (fallback): https://${TARGET_SITE}.firebaseapp.com"

  deploy-docs:
    name: Verify docs on /docs
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Smoke test deployed docs
        env:
          FIREBASE_HOSTING_SITE: ${{ secrets.FIREBASE_HOSTING_SITE }}
          PUBLIC_APP_URL: ${{ vars.PUBLIC_APP_URL }}
        run: |
          set -euo pipefail
          # Checkout is not required for curl smoke tests, but the helper script is.
          # Inline the same normalization so this job stays checkout-free.
          normalize_firebase_site_id() {
            local raw="${1:-}"
            raw="$(printf '%s' "$raw" | tr -d '[:space:]')"
            raw="${raw#https://}"
            raw="${raw#http://}"
            raw="${raw%%/*}"
            raw="${raw%.web.app}"
            raw="${raw%.firebaseapp.com}"
            raw="${raw%.}"
            printf '%s' "$raw"
          }
          if [ -n "${PUBLIC_APP_URL:-}" ]; then
            BASE="$(node -e 'const u=new URL(/^(https?:)?\/\//i.test(process.argv[1])?process.argv[1].startsWith("//")?`https:${process.argv[1]}`:process.argv[1]:`https://${process.argv[1]}`); process.stdout.write(u.origin)' "${PUBLIC_APP_URL}")"
          elif [ -n "${FIREBASE_HOSTING_SITE:-}" ]; then
            SITE_ID="$(normalize_firebase_site_id "$FIREBASE_HOSTING_SITE")"
            BASE="https://${SITE_ID}.web.app"
          else
            echo "Set vars.PUBLIC_APP_URL or secrets.FIREBASE_HOSTING_SITE for smoke tests"
            exit 1
          fi
          echo "Testing docs at ${BASE}/docs/"
          # Docusaurus uses trailing slashes on pages; static files have no trailing slash.
          for path in \
            /docs/ \
            /docs/introduction/product-overview/ \
            /docs/api-playground/ \
            /docs/openapi.yaml; do
            code="$(curl -fsSL -o /dev/null -w "%{http_code}" "${BASE}${path}" || true)"
            echo "${path} -> HTTP ${code}"
            if [ "$code" != "200" ]; then
              echo "Expected HTTP 200 for ${path} (use -L to follow redirects)"
              exit 1
            fi
          done
          echo "Docs smoke tests passed."

  notify-slack:
    needs: [deploy, deploy-docs]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PROJECT_NAME: Findout Frontend + Help Center (/docs)
      JOB_RESULT: ${{ needs.deploy.result == 'success' && needs.deploy-docs.result == 'success' && 'success' || (needs.deploy.result == 'cancelled' || needs.deploy-docs.result == 'cancelled') && 'cancelled' || (needs.deploy.result == 'skipped' && needs.deploy-docs.result == 'skipped') && 'skipped' || 'failure' }}
    steps:
      - name: Build Slack message
        id: slack
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
          DOCS_RESULT: ${{ needs.deploy-docs.result }}
        run: |
          set -euo pipefail
          if [ -z "${SLACK_WEBHOOK_URL:-}" ]; then
            echo "send=false" >> "$GITHUB_OUTPUT"
            echo "SLACK_WEBHOOK_URL not set, skipping notification."
            exit 0
          fi
          echo "send=true" >> "$GITHUB_OUTPUT"
          SHA_SHORT="${GITHUB_SHA:0:7}"

          case "${JOB_RESULT}" in
            success)   STATUS="✅ SUCCESS" ;;
            cancelled) STATUS="🚫 CANCELLED" ;;
            skipped)   STATUS="⏭️ SKIPPED" ;;
            *)         STATUS="❌ FAILED" ;;
          esac

          if [ -n "${COMMIT_MESSAGE:-}" ]; then
            COMMIT_LINE="$(printf '%s' "$COMMIT_MESSAGE" | head -1 | cut -c1-100)"
          else
            COMMIT_LINE="(manual run — no commit message)"
          fi

          RUN_URL="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          FAIL_HINT=""
          if [ "${JOB_RESULT}" != "success" ]; then
            FAILED_JOBS="$(gh run view "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" \
              --json jobs -q '.jobs[] | select(.conclusion=="failure") | .name' 2>/dev/null || true)"
            FAILED_STEPS="$(gh run view "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" \
              --json jobs -q '.jobs[] | select(.conclusion=="failure") | .steps[] | select(.conclusion=="failure") | "\(.number). \(.name)"' 2>/dev/null || true)"

            WHY_LINES=""
            if [ -n "$FAILED_STEPS" ]; then
              STEP_BULLETS="$(printf '%s\n' "$FAILED_STEPS" | sed '/^$/d' | sed 's/^/• /')"
              WHY_LINES="$(printf 'Failed step(s):\n%s' "$STEP_BULLETS")"
            elif [ -n "$FAILED_JOBS" ]; then
              JOB_BULLETS="$(printf '%s\n' "$FAILED_JOBS" | sed '/^$/d' | sed 's/^/• /')"
              WHY_LINES="$(printf 'Failed job(s):\n%s' "$JOB_BULLETS")"
            else
              WHY_LINES="Pipeline did not finish successfully (app: ${DEPLOY_RESULT}, docs: ${DOCS_RESULT})."
            fi

            LOG_SNIPPET=""
            if [ "${JOB_RESULT}" = "failure" ] && command -v gh >/dev/null 2>&1; then
              LOG_SNIPPET="$(gh run view "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --log-failed 2>/dev/null \
                | tail -n 12 | sed 's/\r$//' || true)"
              if [ -n "$LOG_SNIPPET" ]; then
                LOG_SNIPPET="$(printf '%s' "$LOG_SNIPPET" | head -c 1200)"
                WHY_LINES="$(printf '%s\nLast log lines:\n```\n%s\n```' "$WHY_LINES" "$LOG_SNIPPET")"
              fi
            fi

            FAIL_HINT="$(printf '%s\n<%s|Open workflow run>' "$WHY_LINES" "$RUN_URL")"
          fi

          TEXT="$(printf '%s\n*Project:* %s\n*Repo:* `%s`\n*Branch:* `%s`\n*Commit:* `%s` — %s\n*Triggered by:* %s\n*App deploy:* %s | *Docs verify:* %s' \
            "$STATUS" "$PROJECT_NAME" "$GITHUB_REPOSITORY" "$GITHUB_REF_NAME" "$SHA_SHORT" "$COMMIT_LINE" "$GITHUB_ACTOR" "$DEPLOY_RESULT" "$DOCS_RESULT")"

          if [ -n "$FAIL_HINT" ]; then
            TEXT="$(printf '%s\n\n*Why it failed:*\n%s' "$TEXT" "$FAIL_HINT")"
          else
            TEXT="$(printf '%s\n<%s|View workflow run>' "$TEXT" "$RUN_URL")"
          fi

          jq -n --arg text "$TEXT" '{text: $text}' > slack-payload.json

      - name: Notify Slack
        if: steps.slack.outputs.send == 'true'
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          set -euo pipefail
          curl -fsS --max-time 30 --retry 2 --retry-delay 2 \
            -X POST \
            -H 'Content-type: application/json' \
            --data @"slack-payload.json" \
            "$SLACK_WEBHOOK_URL"
          echo "Slack notification sent."
