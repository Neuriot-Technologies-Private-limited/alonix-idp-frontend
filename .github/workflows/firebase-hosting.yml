name: Firebase Hosting CI/CD

on:
  push:
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: firebase-hosting-${{ github.ref }}
  cancel-in-progress: true

jobs:
  live:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm run test:run

      - name: Build app
        env:
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
        run: |
          if [ -z "$VITE_API_BASE_URL" ]; then
            echo "VITE_API_BASE_URL secret is required"
            exit 1
          fi
          printf "VITE_API_BASE_URL=%s\n" "$VITE_API_BASE_URL" > .env.production
          npm run build:findoutai

      - name: Authenticate Firebase service account
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "FIREBASE_SERVICE_ACCOUNT secret is required"
            exit 1
          fi
          SERVICE_ACCOUNT_FILE="$RUNNER_TEMP/firebase-service-account.json"
          printf "%s" "$FIREBASE_SERVICE_ACCOUNT" > "$SERVICE_ACCOUNT_FILE"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$SERVICE_ACCOUNT_FILE" >> "$GITHUB_ENV"

      - name: Deploy live hosting
        env:
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_HOSTING_SITE: ${{ secrets.FIREBASE_HOSTING_SITE }}
        run: |
          if [ -z "$FIREBASE_PROJECT_ID" ]; then
            echo "FIREBASE_PROJECT_ID secret is required"
            exit 1
          fi
          if [ -z "$FIREBASE_HOSTING_SITE" ]; then
            echo "FIREBASE_HOSTING_SITE secret is required"
            exit 1
          fi
          TARGET_ALIAS="findout-v3"
          TARGET_SITE="$FIREBASE_HOSTING_SITE"
          npx -y firebase-tools@latest target:apply hosting "$TARGET_ALIAS" "$TARGET_SITE" \
            --project "$FIREBASE_PROJECT_ID"
          npx -y firebase-tools@latest deploy \
            --only "hosting:${TARGET_ALIAS}" \
            --project "$FIREBASE_PROJECT_ID" \
            --non-interactive
          echo "Live URL: https://${TARGET_SITE}.web.app"
          echo "Live URL (fallback): https://${TARGET_SITE}.firebaseapp.com"

  notify-slack:
    needs: live
    if: always()
    runs-on: ubuntu-latest
    env:
      PROJECT_NAME: Findout Frontend (Firebase Hosting)
      JOB_RESULT: ${{ needs.live.result }}
    steps:
      - name: Build Slack message
        id: slack
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          set -euo pipefail
          if [ -z "${SLACK_WEBHOOK_URL:-}" ]; then
            echo "send=false" >> "$GITHUB_OUTPUT"
            echo "SLACK_WEBHOOK_URL not set, skipping notification."
            exit 0
          fi
          echo "send=true" >> "$GITHUB_OUTPUT"
          SHA_SHORT="${GITHUB_SHA:0:7}"

          case "${JOB_RESULT}" in
            success)   STATUS="✅ SUCCESS" ;;
            cancelled) STATUS="🚫 CANCELLED" ;;
            skipped)   STATUS="⏭️ SKIPPED" ;;
            *)         STATUS="❌ FAILED" ;;
          esac

          if [ -n "${COMMIT_MESSAGE:-}" ]; then
            COMMIT_LINE="$(printf '%s' "$COMMIT_MESSAGE" | head -1 | cut -c1-100)"
          else
            COMMIT_LINE="(manual run — no commit message)"
          fi

          FAIL_HINT=""
          if [ "${JOB_RESULT}" != "success" ]; then
            FAILED_JOB="$(gh run view "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" \
              --json jobs -q '.jobs[] | select(.conclusion=="failure") | .name' 2>/dev/null | head -1 || true)"
            if [ -n "$FAILED_JOB" ]; then
              FAIL_HINT="Failed job: *${FAILED_JOB}*. Check that job's logs in the workflow run."
            else
              FAIL_HINT="Deploy did not finish successfully. Open the workflow run for step logs."
            fi
          fi

          TEXT="${STATUS}
          *Project:* ${PROJECT_NAME}
          *Repo:* \`${GITHUB_REPOSITORY}\`
          *Branch:* \`${GITHUB_REF_NAME}\`
          *Commit:* \`${SHA_SHORT}\` — ${COMMIT_LINE}
          *Triggered by:* ${GITHUB_ACTOR}"

          if [ -n "$FAIL_HINT" ]; then
            TEXT="${TEXT}
          *Why:* ${FAIL_HINT}"
          fi

          jq -n --arg text "$TEXT" '{text: $text}' > slack-payload.json

      - name: Notify Slack
        if: steps.slack.outputs.send == 'true'
        uses: slackapi/slack-github-action@v2.0.0
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload-file-path: slack-payload.json
