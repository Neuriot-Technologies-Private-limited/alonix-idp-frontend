name: Deploy to Firebase Hosting

on:
  push:
    branches:
      - develop
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  actions: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install Gitleaks
        env:
          GITLEAKS_VERSION: 8.24.2
        run: |
          set -euo pipefail
          GITLEAKS_DIR="${RUNNER_TEMP}/gitleaks"
          mkdir -p "$GITLEAKS_DIR"
          curl -sSfL \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C "$GITLEAKS_DIR" gitleaks
          chmod +x "${GITLEAKS_DIR}/gitleaks"
          echo "${GITLEAKS_DIR}" >> "$GITHUB_PATH"

      - name: Scan for secrets (Gitleaks)
        run: |
          gitleaks version
          gitleaks detect --source . --verbose

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:run
      - name: npm audit (fail on high+)
        run: npm audit --audit-level=high

  deploy:
    needs: security
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build app
        env:
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
        run: |
          if [ -z "$VITE_API_BASE_URL" ]; then
            echo "VITE_API_BASE_URL secret is required"
            exit 1
          fi
          printf "VITE_API_BASE_URL=%s\n" "$VITE_API_BASE_URL" > .env.production
          npm run build:findoutai

      - name: Authenticate Firebase service account
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "FIREBASE_SERVICE_ACCOUNT secret is required"
            exit 1
          fi
          SERVICE_ACCOUNT_FILE="$RUNNER_TEMP/firebase-service-account.json"
          printf "%s" "$FIREBASE_SERVICE_ACCOUNT" > "$SERVICE_ACCOUNT_FILE"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$SERVICE_ACCOUNT_FILE" >> "$GITHUB_ENV"

      - name: Deploy live hosting
        env:
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_HOSTING_SITE: ${{ secrets.FIREBASE_HOSTING_SITE }}
        run: |
          if [ -z "$FIREBASE_PROJECT_ID" ]; then
            echo "FIREBASE_PROJECT_ID secret is required"
            exit 1
          fi
          if [ -z "$FIREBASE_HOSTING_SITE" ]; then
            echo "FIREBASE_HOSTING_SITE secret is required"
            exit 1
          fi
          TARGET_ALIAS="findout-v3"
          TARGET_SITE="$FIREBASE_HOSTING_SITE"
          npx -y firebase-tools@latest target:apply hosting "$TARGET_ALIAS" "$TARGET_SITE" \
            --project "$FIREBASE_PROJECT_ID"
          npx -y firebase-tools@latest deploy \
            --only "hosting:${TARGET_ALIAS}" \
            --project "$FIREBASE_PROJECT_ID" \
            --non-interactive
          echo "Live URL: https://${TARGET_SITE}.web.app"
          echo "Live URL (fallback): https://${TARGET_SITE}.firebaseapp.com"

  notify-slack:
    needs: deploy
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PROJECT_NAME: Findout Frontend (Firebase Hosting)
      JOB_RESULT: ${{ needs.deploy.result }}
    steps:
      - name: Build Slack message
        id: slack
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          set -euo pipefail
          if [ -z "${SLACK_WEBHOOK_URL:-}" ]; then
            echo "send=false" >> "$GITHUB_OUTPUT"
            echo "SLACK_WEBHOOK_URL not set, skipping notification."
            exit 0
          fi
          echo "send=true" >> "$GITHUB_OUTPUT"
          SHA_SHORT="${GITHUB_SHA:0:7}"

          case "${JOB_RESULT}" in
            success)   STATUS="✅ SUCCESS" ;;
            cancelled) STATUS="🚫 CANCELLED" ;;
            skipped)   STATUS="⏭️ SKIPPED" ;;
            *)         STATUS="❌ FAILED" ;;
          esac

          if [ -n "${COMMIT_MESSAGE:-}" ]; then
            COMMIT_LINE="$(printf '%s' "$COMMIT_MESSAGE" | head -1 | cut -c1-100)"
          else
            COMMIT_LINE="(manual run — no commit message)"
          fi

          RUN_URL="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          FAIL_HINT=""
          if [ "${JOB_RESULT}" != "success" ]; then
            FAILED_JOBS="$(gh run view "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" \
              --json jobs -q '.jobs[] | select(.conclusion=="failure") | .name' 2>/dev/null || true)"
            FAILED_STEPS="$(gh run view "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" \
              --json jobs -q '.jobs[] | select(.conclusion=="failure") | .steps[] | select(.conclusion=="failure") | "\(.number). \(.name)"' 2>/dev/null || true)"

            WHY_LINES=""
            if [ -n "$FAILED_STEPS" ]; then
              STEP_BULLETS="$(printf '%s\n' "$FAILED_STEPS" | sed '/^$/d' | sed 's/^/• /')"
              WHY_LINES="$(printf 'Failed step(s):\n%s' "$STEP_BULLETS")"
            elif [ -n "$FAILED_JOBS" ]; then
              JOB_BULLETS="$(printf '%s\n' "$FAILED_JOBS" | sed '/^$/d' | sed 's/^/• /')"
              WHY_LINES="$(printf 'Failed job(s):\n%s' "$JOB_BULLETS")"
            else
              WHY_LINES="Deploy did not finish successfully (result: ${JOB_RESULT})."
            fi

            LOG_SNIPPET=""
            if [ "${JOB_RESULT}" = "failure" ] && command -v gh >/dev/null 2>&1; then
              LOG_SNIPPET="$(gh run view "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --log-failed 2>/dev/null \
                | tail -n 12 | sed 's/\r$//' || true)"
              if [ -n "$LOG_SNIPPET" ]; then
                LOG_SNIPPET="$(printf '%s' "$LOG_SNIPPET" | head -c 1200)"
                WHY_LINES="$(printf '%s\nLast log lines:\n```\n%s\n```' "$WHY_LINES" "$LOG_SNIPPET")"
              fi
            fi

            FAIL_HINT="$(printf '%s\n<%s|Open workflow run>' "$WHY_LINES" "$RUN_URL")"
          fi

          TEXT="$(printf '%s\n*Project:* %s\n*Repo:* `%s`\n*Branch:* `%s`\n*Commit:* `%s` — %s\n*Triggered by:* %s' \
            "$STATUS" "$PROJECT_NAME" "$GITHUB_REPOSITORY" "$GITHUB_REF_NAME" "$SHA_SHORT" "$COMMIT_LINE" "$GITHUB_ACTOR")"

          if [ -n "$FAIL_HINT" ]; then
            TEXT="$(printf '%s\n\n*Why it failed:*\n%s' "$TEXT" "$FAIL_HINT")"
          else
            TEXT="$(printf '%s\n<%s|View workflow run>' "$TEXT" "$RUN_URL")"
          fi

          jq -n --arg text "$TEXT" '{text: $text}' > slack-payload.json

      - name: Notify Slack
        if: steps.slack.outputs.send == 'true'
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          set -euo pipefail
          curl -fsS --max-time 30 --retry 2 --retry-delay 2 \
            -X POST \
            -H 'Content-type: application/json' \
            --data @"slack-payload.json" \
            "$SLACK_WEBHOOK_URL"
          echo "Slack notification sent."
