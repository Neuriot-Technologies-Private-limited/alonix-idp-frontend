name: Security Scan

# PR-only gate — push to develop runs security inside firebase-hosting.yml (no duplicate runs).
on:
  pull_request:
    branches: [main, master, develop]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Install Gitleaks
        env:
          GITLEAKS_VERSION: 8.24.2
        run: |
          set -euo pipefail
          GITLEAKS_DIR="${RUNNER_TEMP}/gitleaks"
          mkdir -p "$GITLEAKS_DIR"
          curl -sSfL \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C "$GITLEAKS_DIR" gitleaks
          chmod +x "${GITLEAKS_DIR}/gitleaks"
          echo "${GITLEAKS_DIR}" >> "$GITHUB_PATH"

      - name: Scan for secrets
        run: |
          gitleaks version
          gitleaks detect --source . --verbose

  npm-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      # Production deps only — firebase-tools (devDep) pulls transitive tar/uuid advisories
      # that do not ship in the SPA bundle.
      - name: npm audit (fail on high+)
        run: npm audit --omit=dev --audit-level=high
